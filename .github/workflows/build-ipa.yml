name: Build IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project CinnySwift.xcodeproj -scheme CinnySwift -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/CinnySwift.app Payload/
          zip -qr CinnySwift.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CinnySwift-ipa
          path: CinnySwift.ipa
